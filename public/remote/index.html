<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<title>Slide remote · COSC264</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d151b">
<style>
  :root{
    --bg:#0d151b; --panel:#141f27; --line:#24333d;
    --ink:#e6edf2; --muted:#9aabb6; --faint:#6e808c;
    --accent:#3fb8aa; --accent-ink:#08251f;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-user-select:none;user-select:none;
  }

  /* ---------- pairing ---------- */
  #pair{flex:1;display:flex;flex-direction:column;justify-content:center;
    align-items:center;gap:20px;padding:28px}
  #pair h1{font-size:19px;font-weight:600;margin:0;color:var(--muted);
    letter-spacing:.02em;text-align:center}
  #code{
    width:100%;max-width:320px;font-family:var(--mono);font-size:44px;
    font-weight:700;letter-spacing:.22em;text-align:center;text-indent:.22em;
    background:var(--panel);color:var(--accent);
    border:2px solid var(--line);border-radius:16px;padding:18px 10px;
    text-transform:uppercase;outline:none;
  }
  #code:focus{border-color:var(--accent)}
  #go{
    width:100%;max-width:320px;font-size:19px;font-weight:600;
    background:var(--accent);color:var(--accent-ink);border:0;
    border-radius:16px;padding:17px;cursor:pointer;
  }
  #go:disabled{opacity:.45}
  #msg{margin:0;font-size:15px;color:var(--faint);min-height:1.4em;text-align:center}

  /* ---------- the remote itself ---------- */
  #pad{flex:1;display:none;flex-direction:column}
  #pad.on{display:flex}
  #bar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 18px;font-size:13px;color:var(--faint);
    font-family:var(--mono);letter-spacing:.06em;
  }
  #dot{width:9px;height:9px;border-radius:50%;background:var(--faint);
    display:inline-block;margin-right:7px;vertical-align:middle}
  #dot.live{background:var(--accent)}
  #bar button{background:none;border:0;color:var(--faint);font:inherit;
    text-decoration:underline;cursor:pointer;padding:4px}
  #cc{text-decoration:none;border:1px solid var(--line);border-radius:7px;
    padding:5px 9px;margin-right:8px}
  #cc.on{color:var(--accent);border-color:var(--accent)}
  #cc:disabled{opacity:.4}

  /* Back and Next share one row: they are quick, aimed-by-memory taps, so
     they need reach rather than area. Everything the row gives back goes to
     the pointer, which is the one control you drag around inside. */
  #buttons{flex:1;display:grid;grid-template-rows:1fr 2fr;gap:12px;padding:0 12px 12px}
  #nav{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .key{
    border:2px solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:22px;font-family:var(--sans);font-weight:600;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;cursor:pointer;touch-action:manipulation;
    transition:background .06s ease,border-color .06s ease,transform .06s ease;
  }
  .key .glyph{font-size:44px;line-height:1}
  .key .label{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  #next{border-color:var(--accent);background:#12332f}
  #next .glyph{color:var(--accent)}
  #next .label{color:var(--accent)}
  .key:active{transform:scale(.985);background:#1b2a34}
  #next:active{background:#17453e}
  .key[disabled]{opacity:.4}

  /* Held, never toggled -- so it is coloured like the thing it puts on the
     slide rather than like the two keys above it. */
  #point{border-color:#7d3830;background:#251a18;touch-action:none;
    -webkit-touch-callout:none}
  #point .glyph{font-size:46px;color:#ff6b5e}
  #point .label{color:#c98d85;font-size:14px}
  #point.live{background:#48201c;border-color:#ff6b5e}
  #point.live .label{color:#ffb3aa}
</style>
</head>
<body>

  <section id="pair">
    <h1>Slide remote</h1>
    <input id="code" inputmode="latin" autocomplete="off" autocapitalize="characters"
           spellcheck="false" maxlength="4" placeholder="····" aria-label="Session code">
    <button id="go" disabled>Connect</button>
    <p id="msg">Enter the code shown on the slide.</p>
  </section>

  <section id="pad">
    <div id="bar">
      <span><span id="dot"></span><span id="state">connecting</span></span>
      <span><button id="cc">captions off</button>
      <button id="leave">disconnect</button></span>
    </div>
    <div id="buttons">
      <div id="nav">
        <button class="key" id="prev"><span class="glyph">←</span><span class="label">Back</span></button>
        <button class="key" id="next"><span class="glyph">→</span><span class="label">Next</span></button>
      </div>
      <button class="key" id="point"><span class="glyph">◎</span><span class="label" id="point-label">Hold to point</span></button>
    </div>
  </section>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const STORE = 'cosc264-remote-last-code';

  let ws = null, code = '', seq = 0, retry = 1000, retryTimer = null, quit = false;

  /* ---------- connection ---------- */
  function connect() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const sock = new WebSocket(`${proto}//${location.host}/rc`);
    ws = sock;

    sock.addEventListener('open', () => {
      retry = 1000;
      sock.send(JSON.stringify({ role: 'remote', code }));
    });

    sock.addEventListener('message', ev => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }

      if (m.type === 'nosession') {
        quit = true;
        try { sock.close(); } catch {}
        showPair('No session with that code. Check the slide and try again.');
        return;
      }
      if (m.type === 'joined') {
        try { localStorage.setItem(STORE, code); } catch {}
        showPad();
        setState(m.presenter);
        return;
      }
      if (m.type === 'presenter') setState(m.connected);
    });

    sock.addEventListener('close', () => {
      ws = null;
      if (quit) return;
      setState(false, 'reconnecting');
      clearTimeout(retryTimer);
      retryTimer = setTimeout(connect, retry);
      retry = Math.min(retry * 2, 15000);
    });
    sock.addEventListener('error', () => { try { sock.close(); } catch {} });
  }

  /* ---------- sending ---------- */
  // Only ever "next" or "prev". The sequence number rises monotonically and
  // the deck ignores anything it has already seen, so a double-tap or a
  // delayed packet cannot advance two slides. Nothing here knows or cares
  // what is on the screen.
  function press(cmd, btn) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'cmd', cmd, seq: ++seq }));
    if (navigator.vibrate) navigator.vibrate(12);
    btn.style.transform = 'scale(.985)';
    setTimeout(() => { btn.style.transform = ''; }, 70);
  }

  /* ---------- live captions ----------
   *
   * Speech is recognised by the phone's own browser and only the resulting
   * TEXT is sent. No audio ever reaches the server.
   */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, capOn = false, capWake = null;

  function sendCaption(text, final) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const trimmed = text.trim();
    if (!trimmed) return;
    // Sent raw. The deck owns terminology correction, since the deck is what
    // ends up on the projector.
    ws.send(JSON.stringify({ type: 'caption', text: trimmed, final }));
  }

  function startCaptions() {
    if (!SR) return;
    rec = new SR();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = 'en-NZ';
    rec.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const chunk = e.results[i][0].transcript;
        if (e.results[i].isFinal) sendCaption(chunk, true);
        else interim += chunk;
      }
      if (interim) sendCaption(interim, false);
    };
    // The probe ran 3m45s unbroken on iOS, but if recognition ever does stop
    // itself mid-lecture this quietly puts it back rather than going silent.
    rec.onend = () => { if (capOn) { try { rec.start(); } catch {} } };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        setCaptions(false, 'mic blocked');
      }
    };
    try { rec.start(); } catch {}
    try { if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(l => capWake = l); } catch {}
  }

  function stopCaptions() {
    capOn = false;
    try { rec && rec.stop(); } catch {}
    rec = null;
    try { capWake && capWake.release(); } catch {}
    capWake = null;
  }

  function setCaptions(on, note) {
    capOn = on;
    $('cc').classList.toggle('on', on);
    $('cc').textContent = note || (on ? 'captions on' : 'captions off');
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'captions', on }));
    }
    if (on) startCaptions(); else stopCaptions();
  }

  /* ---------- pointer ----------
   *
   * Held, never toggled -- like the laser pointer it replaces, and for the
   * same reasons: the cursor cannot wander off target while unattended, the
   * tilt origin is retaken on every press so error never accumulates, and the
   * sensors only run while a thumb is actually down.
   *
   * Tilt ONLY. Yaw -- which way the phone is facing -- comes off the
   * magnetometer, and that drifts worst in exactly this room: steel ceiling
   * rig, projector, radio mic. Pitch and roll come off gravity, which does
   * not drift at all, so the phone aims RELATIVE to wherever it happened to
   * be pointing when the key went down. Absolute aiming is not on offer.
   */
  const FULL_X = 26;    // degrees of roll that sweep the full slide width
  const FULL_Y = 20;    // degrees of pitch that sweep the full slide height
  const SMOOTH = 0.25;  // EMA on the raw angles: hand tremor at 8m is visible
  const SEND_MS = 25;   // 40Hz is past the point where anyone can see steps

  let pointing = false;
  let px = 0.5, py = 0.5;         // normalised cursor; PERSISTS between presses
  let originX = 0.5, originY = 0.5;
  let b0 = null, g0 = null;       // orientation captured at press
  let bS = null, gS = null;       // smoothed current orientation
  // Two flags, because they answer different questions. `motionAsked` means
  // the listener is attached; `motionOn` means real angles are actually
  // arriving. Desktop Chrome and plenty of cheap Android hardware expose
  // DeviceOrientationEvent and then never fire it, so treating the interface's
  // existence as proof of a sensor silently disables the drag fallback and
  // leaves the pointer completely dead.
  let motionAsked = false;
  let motionOn = false;
  let lastSent = 0, sentX = -1, sentY = -1;

  // Falls back to the CURRENT position rather than to a number, because the
  // arithmetic feeding this can go non-finite: innerWidth reads 0 while the
  // page is hidden or mid-rotation, and dx/0 is Infinity. A plain min/max
  // would pass NaN straight through (NaN fails both comparisons), park it in
  // px, and kill the pointer for the rest of the session.
  const clamp01 = (v, fallback) =>
    (Number.isFinite(v) ? (v < 0 ? 0 : v > 1 ? 1 : v) : fallback);
  const vw = () => innerWidth || 1280;
  const vh = () => innerHeight || 720;
  const wsOpen = () => ws && ws.readyState === WebSocket.OPEN;

  function sendPoint(on) {
    if (wsOpen()) ws.send(JSON.stringify({ type: 'point', on }));
  }

  function sendMove(force) {
    if (!wsOpen()) return;
    const now = Date.now();
    if (!force) {
      if (now - lastSent < SEND_MS) return;
      if (Math.abs(px - sentX) < 0.002 && Math.abs(py - sentY) < 0.002) return;
    }
    lastSent = now; sentX = px; sentY = py;
    ws.send(JSON.stringify({ type: 'move', x: px, y: py }));
  }

  function sendPing() {
    if (wsOpen()) ws.send(JSON.stringify({ type: 'ping' }));
    if (navigator.vibrate) navigator.vibrate([8, 40, 8]);
  }

  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;
    if (!motionOn) {                       // first real reading: sensor proven
      motionOn = true;
      $('point-label').textContent = 'Tilt to aim';
    }
    bS = bS == null ? e.beta : bS + SMOOTH * (e.beta - bS);
    gS = gS == null ? e.gamma : gS + SMOOTH * (e.gamma - gS);
    if (!pointing) return;
    if (b0 == null) { b0 = bS; g0 = gS; return; }   // first frame of this press
    // Held upright: tilting the top away lowers beta and lifts the cursor;
    // rolling the right edge down raises gamma and moves it right. If either
    // axis ever feels inverted it is one sign on these two lines.
    px = clamp01(originX + (gS - g0) / FULL_X, px);
    py = clamp01(originY + (bS - b0) / FULL_Y, py);
    sendMove(false);
  }

  async function enableMotion() {
    if (motionAsked || !window.DeviceOrientationEvent) return;
    motionAsked = true;
    const ask = DeviceOrientationEvent.requestPermission;
    if (typeof ask === 'function') {
      // iOS gates this behind a user gesture and may re-ask on every load, so
      // the very first press of the key sometimes only buys the permission.
      try { if (await ask.call(DeviceOrientationEvent) !== 'granted') return; }
      catch { return; }
    }
    // motionOn is set by onOrient, once an actual angle turns up.
    addEventListener('deviceorientation', onOrient);
  }

  function pointDown() {
    if (pointing || !wsOpen()) return;
    pointing = true;
    originX = px; originY = py;   // resume from where the last press ended
    b0 = g0 = null;               // and re-origin the tilt for this one
    $('point').classList.add('live');
    enableMotion();
    sendPoint(true);
    sendMove(true);
  }

  function pointUp() {
    if (!pointing) return;
    pointing = false;
    $('point').classList.remove('live');
    sendPoint(false);
  }

  const pk = $('point');
  pk.addEventListener('touchstart', e => { e.preventDefault(); pointDown(); }, { passive: false });
  pk.addEventListener('touchend', e => { e.preventDefault(); pointUp(); }, { passive: false });
  pk.addEventListener('touchcancel', pointUp);
  // Mouse too, so the whole path can be exercised from a laptop with no phone.
  pk.addEventListener('mousedown', e => { e.preventDefault(); pointDown(); });
  addEventListener('mouseup', pointUp);

  // A second finger anywhere on the glass is the highlight. Nothing else
  // competes for a gesture while the key is held, so this needs no tap timer:
  // a double-tap would spend 250ms finding out it was not a single one.
  document.addEventListener('touchstart', e => {
    if (pointing && e.touches.length >= 2) { e.preventDefault(); sendPing(); }
  }, { passive: false });

  // Fallback for a phone with no usable motion sensor, or one where the
  // permission was refused: hold the key and drag, and the glass is a
  // trackpad over the slide. Identical messages either way.
  let tx = null, ty = null;
  document.addEventListener('touchmove', e => {
    if (!pointing || motionOn) return;
    e.preventDefault();
    const t = e.touches[0];
    if (tx != null) {
      px = clamp01(px + (t.clientX - tx) / vw() * 1.6, px);
      py = clamp01(py + (t.clientY - ty) / vh() * 1.6, py);
      sendMove(false);
    }
    tx = t.clientX; ty = t.clientY;
  }, { passive: false });
  document.addEventListener('touchend', () => { tx = ty = null; });
  addEventListener('mousemove', e => {
    if (!pointing || motionOn) return;
    px = clamp01(px + e.movementX / vw() * 1.6, px);
    py = clamp01(py + e.movementY / vh() * 1.6, py);
    sendMove(false);
  });

  /* ---------- views ---------- */
  function showPad() { $('pair').style.display = 'none'; $('pad').classList.add('on'); }
  function showPair(message) {
    $('pad').classList.remove('on');
    $('pair').style.display = 'flex';
    $('msg').textContent = message || 'Enter the code shown on the slide.';
  }
  function setState(live, word) {
    $('dot').classList.toggle('live', !!live);
    $('state').textContent = word || (live ? 'connected' : 'waiting for slides');
    for (const id of ['next', 'prev', 'point']) $(id).disabled = !live;
    // Losing the deck mid-press would otherwise leave the key lit here and a
    // cursor stranded there, with no message able to clear either.
    if (!live) pointUp();
  }

  /* ---------- wiring ---------- */
  const input = $('code');
  input.addEventListener('input', () => {
    input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
    $('go').disabled = input.value.length !== 4;
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !$('go').disabled) $('go').click(); });

  $('go').addEventListener('click', () => {
    code = input.value;
    quit = false;
    $('msg').textContent = 'Connecting…';
    connect();
  });

  $('leave').addEventListener('click', () => {
    if (capOn) setCaptions(false);
    pointUp();
    quit = true;
    try { ws && ws.close(); } catch {}
    try { localStorage.removeItem(STORE); } catch {}
    showPair();
  });

  $('cc').addEventListener('click', () => setCaptions(!capOn));
  if (!SR) { $('cc').disabled = true; $('cc').textContent = 'no captions'; }

  $('next').addEventListener('click', e => press('next', e.currentTarget));
  $('prev').addEventListener('click', e => press('prev', e.currentTarget));

  // Volume-style hardware keys aren't reachable from a web page, but a
  // paired keyboard is, and costs nothing to support.
  document.addEventListener('keydown', e => {
    if ($('pad').classList.contains('on')) {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); press('next', $('next')); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); press('prev', $('prev')); }
    }
  });

  // Offer the last code back, but never auto-join: rejoining a stale session
  // silently would be worse than one extra tap.
  try {
    const last = localStorage.getItem(STORE);
    if (last) { input.value = last; $('go').disabled = false; }
  } catch {}
})();
</script>
</body>
</html>
